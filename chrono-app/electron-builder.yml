appId: com.judovacapp.chrono
productName: JVac-Chrono
copyright: Copyright © JudoVACapp
directories:
  output: release-chrono
  buildResources: chrono-app/build
files:
  - out-chrono/**/*
  - package.json
extraMetadata:
  name: jvac-chrono
  main: out-chrono/main/index.js
extraResources:
  - from: chrono-app/build/icon.png
    to: brand-logo.png
  - from: chrono-app/build/icon.ico
    to: icon.ico
  - from: chrono-app/build/icon.icns
    to: icon.icns
mac:
  icon: chrono-app/build/icon.icns
  category: public.app-category.sports
  target:
    - target: dmg
  artifactName: ${productName}-${version}-${arch}.${ext}
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  icon: chrono-app/build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JVac-Chrono
  uninstallDisplayName: JVac-Chrono
  runAfterFinish: true
  menuCategory: true
